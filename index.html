<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>click me angel ♡</title>

<style>
:root{
  --pink1:#ffd6e7;
  --pink2:#ffc2dc;
  --pink3:#ff9ec7;
  --white:#fff6fb;
}

*{box-sizing:border-box;}

body{
  margin:0;
  min-height:100vh;
  font-family: "Segoe UI", sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 20% 20%, #fff0f6 0%, transparent 40%),
    radial-gradient(circle at 80% 30%, #ffe0f0 0%, transparent 40%),
    linear-gradient(135deg, var(--pink1), var(--pink2));
  overflow:hidden;
}

.sparkles{
  position:fixed;
  inset:0;
  background-image: radial-gradient(white 1px, transparent 1px);
  background-size: 22px 22px;
  opacity:.4;
  animation: float 25s linear infinite;
  pointer-events:none;
}

@keyframes float{
  to{ transform: translateY(-60px); }
}

.card{
  width:min(420px, 92vw);
  background:var(--white);
  border-radius:28px;
  padding:22px;
  box-shadow:0 20px 60px rgba(255,120,170,.3);
  text-align:center;
  position:relative;
}

h1{
  margin:0;
  font-size:20px;
  color:#ff6fa8;
}

.sub{
  font-size:13px;
  color:#cc6c94;
  margin-bottom:14px;
}

.gif{
  border-radius:20px;
  overflow:hidden;
  margin-bottom:14px;
  border:2px solid #ffd2e5;
}

.gif img{
  width:100%;
  height:220px;
  object-fit:cover;
  display:block;
}

button,a{
  display:block;
  width:100%;
  margin:8px 0;
  padding:12px;
  border-radius:16px;
  border:none;
  font-weight:600;
  cursor:pointer;
  text-decoration:none;
  transition:.2s ease;
  background:linear-gradient(135deg, var(--pink2), var(--pink3));
  color:white;
}

button:hover,a:hover{
  transform:scale(1.03);
  box-shadow:0 10px 25px rgba(255,120,170,.4);
}

.tiny{
  font-size:11px;
  margin-top:12px;
  color:#b85f8a;
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#ff9ec7;
  color:white;
  padding:10px 14px;
  border-radius:20px;
  opacity:0;
  transition:.2s;
  font-size:13px;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(-4px);
}
</style>
</head>

<body>
<div class="sparkles"></div>

<div class="card">
  <h1>hi i'm saya ♡</h1>
  <div class="sub">professional princess & part-time bottom frag 🎀</div>

  <div class="gif">
    <!-- change this gif to anything you like -->
    <img src="https://media.tenor.com/9aVn3p9d8mMAAAAC/anime-blush.gif">
  </div>

  <!-- replace links -->
  <a href="https://instagram.com" target="_blank">🎀 my insta</a>
  <a href="https://spotify.com" target="_blank">💌 my playlist</a>

  <button id="delulu">🫧 press for delulu message</button>
  <button id="panic">💗 emergency blush</button>

  <div class="tiny">
    built with love & zero aim ✨<br>
    if i miss it’s because i’m shy
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const toast = (msg)=>{
  const t=document.getElementById("toast");
  t.textContent=msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1600);
};

const lines=[
  "i'm not delulu... i'm visionary 💕"
];

document.getElementById("delulu").onclick=()=>{
  toast(lines[Math.floor(Math.random()*lines.length)]);
};

document.getElementById("panic").onclick=()=>{
  document.body.style.filter="brightness(1.1) saturate(1.3)";
  toast("blushing aggressively 💗");
  setTimeout(()=>document.body.style.filter="",800);
};
</script>

</body>
</html>
